name: fridgefinder_app
description: FridgeFinder mobile app for organizers
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^16.3.0

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Maps - Complete flutter_map stack with all features
  flutter_map: ^8.2.2
  latlong2: ^0.9.0
  flutter_map_marker_cluster: ^8.2.2
  flutter_map_location_marker: ^10.1.0

  # HTTP & API
  dio: ^5.4.0

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  firebase_messaging: ^16.0.3
  cloud_firestore: ^6.0.3

  # Location & Geofencing
  geolocator: ^14.0.2
  permission_handler: ^12.0.1 # For handling permissions cleanly

  # UI Components
  modal_bottom_sheet: ^3.0.0

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0

  # Data Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_cache_manager: ^3.3.1 # For caching map tiles

  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.3
  flutter_svg: ^2.0.10 # For custom SVG icons

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  riverpod_generator: ^3.0.3
  build_runner: ^2.4.9
  freezed: ^3.2.3
  json_serializable: ^6.7.1

  # Testing
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  # Add assets for custom markers
  assets:
    - assets/icons/
    - assets/images/
