name: fridgefinder_app
description: FridgeFinder mobile app for organizers
publish_to: "none"
version: 1.0.0+18

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Design System
  design_system:
    path: packages/design_system

  # Navigation
  go_router: ^16.3.0

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Maps - Complete flutter_map stack with all features
  flutter_map: ^8.2.2
  latlong2: ^0.9.0
  flutter_map_marker_cluster: ^8.2.2

  # HTTP & API
  dio: ^5.4.0
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^3.2.2 # Persistent cache storage for map tiles
  connectivity_plus: ^5.0.0 # Network connectivity detection

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  firebase_messaging: ^16.0.3
  cloud_firestore: ^6.0.3
  firebase_database: ^12.0.3
  cloud_functions: ^6.0.3

  # Location & Geofencing
  geolocator: ^14.0.2
  geocoding: ^3.0.0 # For converting addresses to coordinates
  permission_handler: ^12.0.1 # For handling permissions cleanly

  # UI Components
  modal_bottom_sheet: ^3.0.0

  # Forms & Validation
  flutter_form_builder: ^10.2.0

  # Data Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_cache_manager: ^3.3.1 # For caching map tiles
  path_provider: ^2.1.5 # For getting application directories

  # Utilities
  intl: ^0.20.2
  flutter_svg: ^2.0.10 # For custom SVG icons
  logger: ^2.0.0 # Structured logging for debugging and production
  flutter_map_cache: ^1.5.2
  share_plus: ^10.1.2 # Native share functionality
  url_launcher: ^6.3.1 # Open URLs and maps
  image_picker: ^1.1.2 # Photo upload for status reports
  flutter_image_compress: ^2.3.0 # Image compression and WebP conversion
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^19.5.0
  flutter_dotenv: ^5.1.0 # Environment variable management

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  riverpod_generator: ^3.0.3
  build_runner: ^2.4.9
  freezed: ^3.2.3
  json_serializable: ^6.7.1

  # Testing
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Add assets for custom markers
  assets:
    - assets/icons/
    - assets/images/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  image_path_ios: "assets/icons/app_icon_ios.png" # iOS-specific with blue background
  min_sdk_android: 21
  remove_alpha_ios: false # Not needed since iOS icon already has opaque background
