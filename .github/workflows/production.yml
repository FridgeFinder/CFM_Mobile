name: Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

jobs:
  build-and-release:
    name: Build and Release (Production)
    runs-on: macos-latest
    
    env:
      FLUTTER_VERSION: '3.27.0'
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          
      - name: Install dependencies
        run: |
          cd fridgefinder_flutter
          flutter pub get
          bundle install
          
      - name: Generate code
        run: |
          cd fridgefinder_flutter
          dart run build_runner build --delete-conflicting-outputs
          
      - name: Run full test suite
        run: |
          cd fridgefinder_flutter
          flutter test
          flutter analyze
          
      - name: Generate screenshots
        run: |
          cd fridgefinder_flutter
          flutter test integration_test/screenshot_test.dart || true
          # Screenshots will be generated via Fastlane snapshot
          
      - name: Generate iOS screenshots
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cd fridgefinder_flutter/ios
          bundle exec fastlane screenshots
          
      - name: Set up Android keystore
        run: |
          cd fridgefinder_flutter/android
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > keystore.jks
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> key.properties
          echo "storeFile=$(pwd)/keystore.jks" >> key.properties
          
      - name: Build Android Release
        run: |
          cd fridgefinder_flutter
          flutter build appbundle --release
          
      - name: Build iOS Release
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cd fridgefinder_flutter
          flutter build ipa --release
          
      - name: Release to Google Play Store
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          cd fridgefinder_flutter/android
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" | base64 -d > google-play-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/google-play-service-account.json
          bundle exec fastlane release
          rm -f google-play-service-account.json
          
      - name: Release to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cd fridgefinder_flutter/ios
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" | base64 -d > AuthKey.p8
          export APP_STORE_CONNECT_API_KEY_PATH=$(pwd)/AuthKey.p8
          bundle exec fastlane release
          rm -f AuthKey.p8
          
      - name: Cleanup
        if: always()
        run: |
          cd fridgefinder_flutter/android
          rm -f keystore.jks key.properties

