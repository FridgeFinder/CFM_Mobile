name: Dev Environment

on:
  push:
    tags:
      - 'dev/**'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for this build'
        required: false
        default: 'Dev build from CI/CD'

jobs:
  build-and-distribute:
    name: Build and Distribute (Dev)
    runs-on: macos-latest
    
    env:
      FLUTTER_VERSION: '3.24.0'
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          
      - name: Install dependencies
        run: |
          cd fridgefinder_flutter
          flutter pub get
          bundle install
          
      - name: Generate code
        run: |
          cd fridgefinder_flutter
          dart run build_runner build --delete-conflicting-outputs
          
      - name: Run tests
        run: |
          cd fridgefinder_flutter
          flutter test
          
      - name: Set up Android keystore
        run: |
          cd fridgefinder_flutter/android
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > keystore.jks
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> key.properties
          echo "storeFile=$(pwd)/keystore.jks" >> key.properties
          
      - name: Build Android
        run: |
          cd fridgefinder_flutter
          flutter build appbundle --release
          
      - name: Distribute Android to Firebase
        env:
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_DISTRIBUTION_GROUPS: 'dev-testers'
        run: |
          cd fridgefinder_flutter/android
          bundle exec fastlane beta
          
      - name: Build and distribute iOS to TestFlight
        env:
          APP_ENV: dev
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cd fridgefinder_flutter/ios
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" | base64 -d > AuthKey.p8
          export APP_STORE_CONNECT_API_KEY_PATH=$(pwd)/AuthKey.p8
          bundle exec fastlane dev_testflight
          rm -f AuthKey.p8
          
      - name: Cleanup
        if: always()
        run: |
          cd fridgefinder_flutter/android
          rm -f keystore.jks key.properties
          cd ../ios
          rm -f AuthKey.p8

