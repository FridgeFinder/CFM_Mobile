name: Generate Screenshots

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  screenshots:
    name: Generate Screenshots
    runs-on: macos-latest
    
    env:
      FLUTTER_VERSION: '3.24.0'
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          
      - name: Install dependencies
        run: |
          cd fridgefinder_flutter
          flutter pub get
          bundle install
          
      - name: Generate code
        run: |
          cd fridgefinder_flutter
          dart run build_runner build --delete-conflicting-outputs
          
      - name: Generate iOS screenshots
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cd fridgefinder_flutter/ios
          bundle exec fastlane screenshots
          
      - name: Upload iOS screenshots
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          cd fridgefinder_flutter/ios
          bundle exec fastlane screenshots
          
      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            fridgefinder_flutter/ios/fastlane/screenshots
            fridgefinder_flutter/android/fastlane/screenshots
          retention-days: 30

